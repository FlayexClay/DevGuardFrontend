# Cabeceras de seguridad del frontend. Se incluyen en cada location porque en
# nginx un add_header dentro de un location anula los heredados del server.
#
# Falta una Content-Security-Policy: el build de Angular inyecta CSS critico
# en linea con un manejador onload, y una CSP estricta lo bloquearia. Hay que
# definirla junto con esa opcion del build (inlineCritical) y probarla.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

<div class="space-y-8">
  <div class="flex items-start justify-between">
    <div>
      <a routerLink="/projects" class="text-xs text-slate-500 hover:text-slate-300">
        &larr; Proyectos
      </a>
      <h1 class="mt-1 text-2xl font-semibold">
        {{ loading() ? 'Cargando...' : (project()?.name ?? 'Proyecto no disponible') }}
      </h1>
      <p class="font-mono text-xs text-slate-500">{{ project()?.slug }}</p>
    </div>
    <button type="button" class="dg-btn-link" (click)="loadAll()">Actualizar</button>
  </div>

  @if (error(); as message) {
    <dg-alert kind="error">{{ message }}</dg-alert>
  }
  @if (notice(); as message) {
    <dg-alert kind="info">{{ message }}</dg-alert>
  }

  <div class="grid gap-6 lg:grid-cols-3">
    <dg-score-card [score]="score()" />
    <dg-score-trend [points]="trend()" />
    <dg-authorized-repos
      [repositories]="repositories()"
      [scanInProgress]="scanInProgress()"
      (scanRequested)="requestScan($event)"
    />
  </div>

  <dg-remediation-list
    [projectId]="id()"
    [groups]="groups()"
    (findingUpdated)="onFindingUpdated()"
  />

  @if (scans().length > 0) {
    <dg-scan-history [scans]="scans()" />
  }
</div>

<div class="space-y-10">
  <div class="flex items-start justify-between">
    <div>
      <a routerLink="/projects" class="text-sm text-slate-500 hover:text-slate-300">
        &larr; Proyectos
      </a>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight">
        {{ loading() ? 'Cargando...' : (project()?.name ?? 'Proyecto no disponible') }}
      </h1>
      <p class="mt-1 font-mono text-sm text-slate-500">{{ project()?.slug }}</p>
    </div>
    <button type="button" class="dg-btn-link" (click)="loadAll()">Actualizar</button>
  </div>

  @if (error(); as message) {
    <dg-alert kind="error">{{ message }}</dg-alert>
  }
  @if (notice(); as message) {
    <dg-alert kind="info">{{ message }}</dg-alert>
  }

  <div class="grid gap-6 lg:grid-cols-5 lg:gap-8">
    <dg-score-card class="lg:col-span-2" [score]="score()" />
    <dg-score-trend class="lg:col-span-3" [points]="trend()" />
  </div>

  <dg-authorized-repos
    [projectId]="id()"
    [repositories]="repositories()"
    [scanInProgress]="scanInProgress()"
    (scanRequested)="requestScan($event)"
    (revokeRequested)="revokeRepository($event)"
    (connected)="onRepositoryConnected()"
  />

  <dg-remediation-list
    [projectId]="id()"
    [groups]="groups()"
    (findingUpdated)="onFindingUpdated()"
  />

  @if (scans().length > 0) {
    <dg-scan-history [scans]="scans()" />
  }
</div>

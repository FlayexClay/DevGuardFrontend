# nginx interno del contenedor del frontend.
#
# No hace proxy de /api: de eso se encarga el gateway, que esta delante y
# enruta /api a la API y el resto aqui. Duplicar ese enrutamiento crearia dos
# sitios donde cambiarlo.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los archivos con hash en el nombre no cambian nunca: cachearlos a largo
    # plazo es seguro y evita descargarlos en cada visita.
    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NO se cachea: es lo que apunta a los archivos con hash, y si
    # queda cacheado el navegador seguiria pidiendo la version anterior
    # despues de un despliegue.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Enrutado del lado del cliente: cualquier ruta desconocida devuelve
    # index.html para que Angular resuelva la navegacion.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
